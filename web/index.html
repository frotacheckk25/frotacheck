<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="FrotaCheck - Gestão de frota">
  <base href="$FLUTTER_BASE_HREF">

  <!-- PWA / theme -->
  <meta name="theme-color" content="#2563EB">
  <meta name="background-color" content="#0B1220">
  <meta name="color-scheme" content="dark light">

  <!-- Android / Chrome / Edge installability -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="FrotaCheck">

  <!-- iOS / Safari "Add to Home Screen" -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FrotaCheck">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>FrotaCheck</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0B1220;
    }
    /* O <flutter-view> é posicionado com "position: absolute; inset: 0"
       relativo ao viewport inteiro (não ao body) — por isso um padding no
       body não reserva espaço nenhum para a área de gestos do Android.
       Forçamos aqui via "bottom" (que tem prioridade sobre o inset inline
       que o próprio engine aplica), para a barra de navegação do app nunca
       ficar desenhada sob a faixa de gesto do sistema, onde o toque é
       interceptado pelo Android antes de chegar à página. */
    flutter-view {
      bottom: env(safe-area-inset-bottom, 0px) !important;
      /* O engine também fixa "height" inline (em px) a cada resize — com
         "top", "height" e "bottom" todos definidos, a especificação CSS
         ignora "bottom" no cálculo do layout (over-constrained) e a altura
         renderizada nunca muda. "height: auto" remove esse conflito, para
         o navegador recalcular a altura de fato a partir de top+bottom. */
      height: auto !important;
    }
    #fc-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B1220;
      transition: opacity 0.35s ease;
    }
    #fc-splash.fc-splash-hidden {
      opacity: 0;
      pointer-events: none;
    }
    #fc-splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      animation: fc-pulse 1.6s ease-in-out infinite;
    }
    @keyframes fc-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.94); opacity: 0.75; }
    }
  </style>
</head>
<body>
  <!-- Splash screen shown while the Flutter engine boots. Removed by the
       script at the bottom once the first frame paints (or after a safety
       timeout, in case the 'flutter-first-frame' hook ever changes). -->
  <div id="fc-splash">
    <img src="icons/Icon-512.png" alt="FrotaCheck">
  </div>

  <!-- Externalizado em fc_boot.js (em vez de inline) para que o CSP em
       vercel.json possa usar script-src 'self' sem 'unsafe-inline'. -->
  <script src="fc_boot.js"></script>

  <script type="module" src="flutter_bootstrap.js"></script>
</body>
</html>
